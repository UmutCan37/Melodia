@if (player.error(); as message) {
  <div class="toast" role="alert">
    <i class="pi pi-exclamation-circle"></i>
    {{ message }}
  </div>
}

@if (player.current(); as song) {
  <div class="bar">
    <div class="bar__song">
<span class="bar__art" aria-hidden="true">
  <app-cover class="bar__cover" [name]="song.artistName" />
  <span class="eq" [class.eq--on]="player.isPlaying()">
    <i></i><i></i><i></i>
  </span>
</span>
      <div class="bar__meta">
        <strong>{{ song.title }}</strong>
        <span>{{ song.artistName }}</span>
      </div>
    </div>

    <div class="bar__center">
      <button
        type="button"
        class="bar__toggle"
        (click)="player.toggle()"
        [disabled]="player.isLoading()"
        [attr.aria-label]="player.isPlaying() ? 'Duraklat' : 'Çal'"
      >
        @if (player.isLoading()) {
          <i class="pi pi-spin pi-spinner"></i>
        } @else if (player.isPlaying()) {
          <i class="pi pi-pause"></i>
        } @else {
          <i class="pi pi-play"></i>
        }
      </button>

      <div class="bar__progress">
        <span class="bar__time">{{ player.position() | duration }}</span>
        <input
          type="range"
          class="range"
          min="0"
          step="0.1"
          [max]="player.duration()"
          [value]="player.position()"
          [style.--fill]="progress() + '%'"
          (input)="onSeek($event)"
          aria-label="Şarkıda ilerle"
        />
        <span class="bar__time">{{ player.duration() | duration }}</span>
      </div>
    </div>

    <div class="bar__volume">
      <i [class]="volumeIcon()" aria-hidden="true"></i>
      <input
        type="range"
        class="range"
        min="0"
        max="1"
        step="0.01"
        [value]="player.volume()"
        [style.--fill]="player.volume() * 100 + '%'"
        (input)="onVolume($event)"
        aria-label="Ses seviyesi"
      />
    </div>
  </div>
}
